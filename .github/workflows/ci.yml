name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs electron-builder install-app-deps, which rebuilds
      # better-sqlite3 from source through node-gyp. That needs Python's
      # distutils, gone since 3.12, so it fails on current runners — and it is
      # not needed here: typecheck, tests and build never load the native
      # module, and better-sqlite3 ships prebuilds for every platform anyway.
      # Packaging still rebuilds it locally, where postinstall does run.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
