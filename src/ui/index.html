<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sovo</title>
    <!--
      Sandboxed srcdoc frames INHERIT this policy — a child CSP can only
      further restrict it, never re-grant. Attachment previews use data:, and
      remote mail images are https:, so both need granting here or they
      silently never paint. Whether remote images load is the sanitiser's
      call (Settings → Images); this only permits them when it allows.
      Scripts and network stay locked to 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; object-src data:; frame-src 'self' data:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
